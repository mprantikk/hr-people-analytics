name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Data is reproducible
        run: |
          python -m people.generate
          git diff --exit-code data/
      - run: pytest -v
      - name: Build report
        run: python -m people.report
      - uses: actions/upload-artifact@v4
        with:
          name: people-report
          path: reports/
